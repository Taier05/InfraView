services:
  infraview:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${INFRAVIEW_ENV_FILE:-.env}
    ports:
      - "${INFRAVIEW_PORT:-8080}:8080"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/infraview", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
    stop_grace_period: 15s
